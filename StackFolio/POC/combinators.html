      /* adjacent sibling combinator */
      h2 + ul {
        color: rgb(51, 142, 31);
      }

      /* general sibling combinator */
      h2 ~ ul {
        color: lightpink;
      }

      h2{
        color: green !important;
      }
    </style>
  </head>
  <body>
    <div class="family">
      <h2 style="color: red;">The Family Title</h2>
      <ul class="members">
        <li class="person">Alice</li>
        <li class="person">Bob</li>
        <li class="person">Carol</li>
      </ul>

      <ul class="members">
        <li class="person">Alice</li>
        <li class="person">Bob</li>
        <li class="person">Carol</li>
      </ul>
      <p class="note">A note about the family.</p>
      <div>
        <p>2 level deep</p>
      </div>
    </div>
  </body>
</html>
