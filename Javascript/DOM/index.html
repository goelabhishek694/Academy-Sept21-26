<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecting Elements</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="main-title">Welcome to DOM Class</h1>
    <p class="intro">This is the first paragraph.</p>
    <div>
        <p class="intro">This is the second paragraph.</p>
    </div>
    <button id="btn-1">Click Me</button>
    <button class="action-btn">Submit</button>
    <button class="action-btn" onclick="doFirst(); doSecond();" onkeydown="" onmouseover="" >Cancel</button>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>

        <li>8</li>
        <li>9</li>
        <li>10</li>
    </ul>

    <div class="box"></div>


    <script src="./script.js"></script>
    <script>
        function doFirst(){
            console.log("first thing")
        }

        function doSecond(){
            console.log("second thing")
        }
    </script>
</body>

</html>
