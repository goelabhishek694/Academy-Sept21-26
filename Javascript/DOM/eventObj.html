<!DOCTYPE html>
<html>

<head>
    <title>Event Object Demo</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            transition: background-color 0.3s;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }

        #red {
            background-color: red;
        }

        #green {
            background-color: green;
        }

        #blue {
            background-color: blue;
        }
    </style>
</head>

<body>
    <h2>Click a color button</h2>
    <button id="red" data-color="red">Red</button>
    <button id="green" data-color="green">Green</button>
    <button id="blue" data-color="blue">Blue</button>
    <script src="./eventObj.js"></script>
</body>

</html>
