<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Filter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav id="navbar">Movie Browser</nav>
  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search movies...">
      <button id="addMovie">
        + Add Movie
      </button>
    </div>
    <div id="movieList">
      <div class="movie-card">
        <span class="movie-title">The Dark Knight</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Inception</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Interstellar</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">The Matrix</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Pulp Fiction</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">The Godfather</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Fight Club</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Forrest Gump</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">

        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Gladiator</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">The Prestige</span>
        <button class="delete-btn">X</button>
      </div>
      <div class="movie-card">
        <span class="movie-title">Memento</span>
        <button class="delete-btn">X</button>
      </div>
    </div>
  </div>
  <script src="./movie-filter.js"></script>
</body>

</html>
